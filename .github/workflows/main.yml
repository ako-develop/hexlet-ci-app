name: Node CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
      # BEGIN
      - name: Setup
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - uses: hexlet-components/hello-from-hexlet-action@release
      # END
